<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>English Mentor AI – Inglês Power</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0A1F44;--blue:#1E40FF;--gold:#FFC700;--grey:#F2F4F7;--border:#E4E7EF;--muted:#9EA6B8;--text:#0A1F44}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(160deg,#0A1F44 0%,#0e2a5c 50%,#0A1F44 100%);min-height:100vh}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:680px;background:#fff;border-radius:24px;display:flex;flex-direction:column;height:96vh;max-height:860px;overflow:hidden;box-shadow:0 40px 100px rgba(10,31,68,.6)}
.hdr{padding:18px 24px;border-bottom:3px solid var(--gold);background:var(--navy);display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo{width:48px;height:48px;border-radius:14px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;animation:pg 2.5s ease-in-out infinite}
.title{font-weight:800;font-size:17px;color:#fff}.sub{font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 6px #4ADE80;flex-shrink:0}
.badge{margin-left:auto;background:var(--gold);color:var(--navy);font-weight:800;font-size:10px;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;white-space:nowrap}
.qbar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--grey);flex-shrink:0;scrollbar-width:none}
.qbar::-webkit-scrollbar{display:none}
.qbtn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;flex-shrink:0}
.qbtn:disabled{opacity:.5;cursor:not-allowed}
.msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;background:var(--grey)}
.row{display:flex;margin-bottom:16px;animation:fi .3s ease}
.row.u{justify-content:flex-end}.row.b{justify-content:flex-start}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.av.b{background:var(--blue);margin-right:10px}.av.u{background:var(--grey);border:2px solid var(--border);margin-left:10px}
.bub{max-width:74%;padding:12px 16px;font-size:14px;line-height:1.7}
.bub.b{border-radius:18px 18px 18px 4px;background:#fff;border:1px solid var(--border);color:var(--text)}
.bub.u{border-radius:18px 18px 4px 18px;background:var(--blue);color:#fff}
.bub strong{color:var(--blue)}.bub.u strong{color:var(--gold)}
.tdots{display:flex;align-items:center;gap:5px;padding:4px 0}
.td{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:bo 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
.inp-area{padding:14px 16px;border-top:1px solid var(--border);background:#fff;flex-shrink:0}
.inp-wrap{display:flex;gap:10px;align-items:flex-end;background:var(--grey);border:1.5px solid var(--border);border-radius:22px;padding:10px 14px}
.inp-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,64,255,.12)}
#ti{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;line-height:1.55;resize:none;max-height:120px;overflow-y:auto}
#ti::placeholder{color:var(--muted)}
.sbtn{width:40px;height:40px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:#fff}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;margin-top:8px;font-size:11px;color:var(--muted)}
@keyframes bo{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(255,199,0,.5)}50%{box-shadow:0 0 0 10px rgba(255,199,0,0)}}
@media(max-width:480px){#app{padding:0}.card{border-radius:0;height:100vh;max-height:100vh}}
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="hdr">
      <div class="logo">🎓</div>
      <div>
        <div class="title">English Mentor AI</div>
        <div class="sub"><div class="dot"></div>Online 24/7 • Para falantes de português</div>
      </div>
      <div class="badge">INGLÊS POWER</div>
    </div>
    <div class="qbar" id="qbar"></div>
    <div class="msgs" id="msgs"></div>
    <div class="inp-area">
      <div class="inp-wrap">
        <textarea id="ti" rows="1" placeholder="Escreva em inglês ou português... 💬" onkeydown="hk(event)" oninput="ar(this)"></textarea>
        <button class="sbtn" id="sb" onclick="send()" disabled>➤</button>
      </div>
      <div class="hint">Enter para enviar • Shift+Enter para nova linha</div>
    </div>
  </div>
</div>
<script>
const API_KEY="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";
const SYS=`You are an AI English mentor for Portuguese-speaking Brazilian students. Be friendly, warm, and practical. Keep answers short. Use **bold** for key words and emojis.
1. TRANSLATION: Portuguese to English and English to Portuguese, natural like a native speaker.
2. GRAMMAR: Show corrected sentence + short explanation + natural alternative.
3. CONVERSATION: Natural chat, one question at a time, correct gently.
4. SENTENCE BUILDER: English sentence + variation + quick tip.
5. VOCABULARY: Meaning + pronunciation tip + examples.
6. PRONUNCIATION: Simple phonetics for Portuguese speakers.
7. LESSONS: Short practical lessons with examples and practice questions.
8. REAL-LIFE ENGLISH: Phrasal verbs, expressions, natural spoken English.
9. BEGINNER: Simple English, explain in Portuguese when needed.
10. MOTIVATION: Encourage! Mistakes are part of learning.`;
const ACTIONS=[
  {l:"🌍 Traduzir",q:"Como se diz em inglês: 'Estou animado para essa viagem'?"},
  {l:"✏️ Corrigir",q:"Correct this: I am very happy for meet you."},
  {l:"💬 Conversar",q:"Let's practice a conversation in English. You start!"},
  {l:"📖 Lição",q:"Teach me phrasal verbs with examples. Keep it short!"},
  {l:"🔊 Pronúncia",q:"How do I pronounce 'thought'? I'm a Portuguese speaker."},
  {l:"📚 Vocabulário",q:"What does 'overwhelming' mean? Give me 2 examples."},
];
const WELCOME="Olá! I'm your English Mentor 🎓\n\nEstou aqui 24h para te ajudar a aprender inglês de verdade — sem enrolação, sem decoreba.\n\nO que você quer praticar hoje? 👇";
let history=[],busy=false;
ACTIONS.forEach(a=>{
  const b=document.createElement("button");
  b.className="qbtn";b.textContent=a.l;
  b.onclick=()=>send(a.q);
  document.getElementById("qbar").appendChild(b);
});
addMsg("b",WELCOME);
document.getElementById("ti").addEventListener("input",()=>{
  document.getElementById("sb").disabled=!document.getElementById("ti").value.trim()||busy;
});
function fmt(text,isUser){
  return text.split("\n").map(ln=>{
    const e=ln.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return e.replace(/\*\*([^*]+)\*\*/g,(_,w)=>`<strong style="color:${isUser?"#FFC700":"#1E40FF"}">${w}</strong>`);
  }).join("<br>");
}
function addMsg(type,text){
  const msgs=document.getElementById("msgs");
  const row=document.createElement("div");row.className=`row ${type}`;
  if(type==="b"){const av=document.createElement("div");av.className="av b";av.textContent="🎓";row.appendChild(av);}
  const bub=document.createElement("div");bub.className=`bub ${type}`;bub.innerHTML=fmt(text,type==="u");row.appendChild(bub);
  if(type==="u"){const av=document.createElement("div");av.className="av u";av.textContent="🙋";row.appendChild(av);}
  msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
}
function addTyping(){
  const msgs=document.getElementById("msgs");
  const row=document.createElement("div");row.className="row b";row.id="trow";
  row.innerHTML=`<div class="av b">🎓</div><div class="bub b"><div class="tdots"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`;
  msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){const el=document.getElementById("trow");if(el)el.remove();}
function setDisabled(val){
  busy=val;
  document.getElementById("sb").disabled=val||!document.getElementById("ti").value.trim();
  document.querySelectorAll(".qbtn").forEach(b=>b.disabled=val);
}
async function send(override){
  const ti=document.getElementById("ti");
  const text=override||ti.value.trim();
  if(!text||busy)return;
  ti.value="";ti.style.height="auto";
  setDisabled(true);
  history.push({role:"user",content:text});
  addMsg("u",text);addTyping();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":API_KEY,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1024,system:SYS,messages:history}),
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    if(!reply)throw new Error("Resposta vazia.");
    history.push({role:"assistant",content:reply});
    removeTyping();addMsg("b",reply);
  }catch(err){
    removeTyping();
    let msg=err.message;
    if(msg.includes("401"))msg="❌ API Key inválida.";
    else if(msg.includes("429"))msg="⏳ Muitas requisições. Aguarde.";
    else if(msg.includes("fetch"))msg="📶 Sem internet.";
    addMsg("b",`⚠️ ${msg}`);history.pop();
  }finally{setDisabled(false);}
}
function hk(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function ar(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
  document.getElementById("sb").disabled=!el.value.trim()||busy;
}
</script>
</body>
</html>
